<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机视口取景框</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b2b2b; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var w = q.get('w') || '390';
  var h = q.get('h') || '844';
  var f = document.createElement('iframe');
  f.width = w;
  f.height = h;
  f.src = '../index.html?' + (q.get('q') || '');
  document.body.appendChild(f);
</script>
</body>
</html>
